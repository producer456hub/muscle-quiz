<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Muscle Quiz: Stat! — Muscles, Muscle Tissue & Landmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0518; --panel:#160a1f; --panel2:#22102f;
    --line:#7a3aa0; --text:#fdf7ff; --muted:#d2bee6;
    --phos:#ff3ca6; --quiz:#ff3ca6; --good:#2ad4ff; --bad:#ff3b3b; --gold:#ffd45e; --purple:#b388ff;
    --px:'Press Start 2P','Courier New',monospace;
    --rt:'VT323','Courier New',monospace;
    --bevel: inset -3px -3px 0 0 rgba(0,0,0,.5), inset 3px 3px 0 0 rgba(255,255,255,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{margin:0;
    font-family:var(--rt); font-size:23px; letter-spacing:.2px;
    background:var(--bg); background-attachment:fixed;
    color:var(--text); overflow-x:hidden; user-select:none; min-height:100%;
  }
  .choice,.cell,.btn,.iconbtn,.backbtn{touch-action:manipulation;}
  /* CRT overlay */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:60;}
  #crt::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(rgba(255,255,255,.005) 0 2px, rgba(0,0,0,.04) 2px 5px);}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(140% 140% at 50% 50%, transparent 70%, rgba(0,0,0,.28) 100%);
    animation:flicker 6s infinite steps(40);}
  @keyframes flicker{0%,100%{opacity:1}48%{opacity:.98}50%{opacity:.96}52%{opacity:.99}}
  #scanbar{position:fixed;left:0;right:0;height:60px;pointer-events:none;z-index:59;
    background:linear-gradient(to bottom, transparent, rgba(255,60,166,.06), transparent);
    animation:scan 7s linear infinite;}
  @keyframes scan{0%{top:-60px}100%{top:100%}}

  #app{min-height:100vh; display:flex; flex-direction:column; transition:transform .05s; position:relative; z-index:2;}
  #app.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}

  header{display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:var(--panel); border-bottom:4px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; row-gap:8px;}
  header .logo{font-family:var(--px); font-size:14px; line-height:1.5; color:var(--phos); display:flex; align-items:center; gap:10px; text-shadow:0 0 8px var(--phos);}
  header .logo .tagline{color:var(--muted);font-size:9px;text-shadow:none;}
  .pulse{color:var(--bad); font-size:18px; text-shadow:0 0 10px var(--bad); animation:beat 1s infinite; display:inline-block;}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.5)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
  header .spacer{flex:1;}

  .iconbtn,.backbtn,.btn{font-family:var(--px); cursor:pointer; border:none; color:var(--text);
    background:var(--panel2); box-shadow:var(--bevel), 0 4px 0 #0a0418; transition:transform .06s, box-shadow .06s, background .1s;}
  .iconbtn{font-size:14px; padding:10px 12px;}
  .backbtn{font-size:10px; padding:10px 12px; color:var(--phos);}
  .iconbtn:active,.backbtn:active,.btn:active{transform:translateY(4px); box-shadow:var(--bevel);}
  .iconbtn:hover,.backbtn:hover{filter:brightness(1.2);}

  main{flex:1; padding:18px 18px 104px; position:relative; z-index:2;}
  .game{max-width:1040px;margin:0 auto;}
  .game h2{font-family:var(--px); margin:0 0 10px; font-size:18px; color:var(--quiz); text-shadow:0 0 5px var(--quiz); line-height:1.4;}
  .game .sub{color:var(--muted);margin:0 0 16px;font-size:20px;line-height:1.4;}

  /* stats + combo */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .stat{background:var(--panel);box-shadow:var(--bevel);padding:8px 14px;font-size:19px;color:var(--text);border-left:4px solid var(--line);}
  .stat b{font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:0 0 3px var(--gold);}
  .combo{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .combo .lab{color:var(--muted);font-size:17px;}
  .multi{font-family:var(--px);font-size:14px;padding:8px 12px;background:var(--gold);color:#3a2400;box-shadow:var(--bevel);}
  .multi.bump{animation:multibump .5s;}
  @keyframes multibump{0%{transform:scale(1)}40%{transform:scale(1.5);filter:brightness(1.4)}100%{transform:scale(1)}}
  .combobar,.progress,.timerbar{background:#120726;box-shadow:var(--bevel);overflow:hidden;}
  .combobar{width:130px;height:16px;}
  .combobar > i{display:block;height:100%;width:0;transition:width .3s;
    background:repeating-linear-gradient(90deg,var(--gold) 0 8px, #c98a00 8px 10px);}
  .progress{height:16px;margin:0 0 16px;}
  .progress > i{display:block;height:100%;width:0;transition:width .4s steps(20);
    background:repeating-linear-gradient(90deg,var(--quiz) 0 8px, #8a1f5a 8px 10px);}
  .timerbar{height:18px;margin-bottom:14px;}
  .timerbar > i{display:block;height:100%;width:100%;
    background:repeating-linear-gradient(90deg,var(--good) 0 10px, #120726 10px 12px);}

  .prompt{background:var(--panel2);box-shadow:var(--bevel),0 0 24px rgba(255,60,166,.3);padding:22px 24px;margin-bottom:18px;font-size:30px;line-height:1.5;border-left:7px solid var(--quiz);color:var(--text);}

  .qtop{text-align:right;margin-bottom:8px;}
  .qclose{font-family:var(--rt);font-size:16px;background:var(--panel);color:var(--muted);border:none;box-shadow:var(--bevel);padding:8px 12px;cursor:pointer;touch-action:manipulation;}
  .qclose:hover{color:var(--text);filter:brightness(1.2);}
  .choices{display:grid;gap:12px;}
  .choice{font-family:var(--rt);font-size:27px;line-height:1.3;background:var(--panel2);box-shadow:var(--bevel),0 4px 0 #0a0418;padding:18px 20px;cursor:pointer;text-align:left;color:var(--text);border-left:4px solid var(--line);transition:transform .06s,filter .1s,border-color .1s;}
  .choice:hover{filter:brightness(1.25);}
  .choice:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .choice.correct{background:#0a2536;color:var(--good);box-shadow:var(--bevel),0 0 16px var(--good);animation:popcorrect .4s;}
  .choice.wrong{background:#3a0c12;color:var(--bad);box-shadow:var(--bevel),0 0 16px var(--bad);animation:nudge .3s;}
  @keyframes popcorrect{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .btn{font-size:13px;padding:14px 20px;background:var(--quiz);color:#02232b;}
  .btn:hover{filter:brightness(1.15);}
  .btn.ghost{background:var(--panel2);color:var(--text);}

  .feedback{margin-top:14px;padding:14px 16px;font-size:21px;line-height:1.55;display:none;box-shadow:var(--bevel);}
  .feedback.show{display:block;animation:fadeup .3s;}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .feedback.ok{background:#0a2230;border-left:5px solid var(--good);}
  .feedback.no{background:#2c0a10;border-left:5px solid var(--bad);}
  .feedback .term{font-family:var(--px);font-size:13px;color:var(--gold);text-shadow:0 0 2px var(--gold);}
  .defmain{font-size:20px;line-height:1.45;margin:9px 0 7px;color:var(--text);}
  .defs{margin-top:12px;display:grid;gap:6px;text-align:left;border-top:1px solid var(--line);padding-top:10px;}
  .defslabel{font-family:var(--px);font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:2px;}
  .optdef{font-size:16px;line-height:1.35;color:var(--muted);}
  .optdef b{color:var(--text);}
  .learnrow{margin:2px 0 8px;font-size:16px;}
  .learnmore{color:var(--quiz);text-decoration:none;font-family:var(--rt);border-bottom:1px dotted var(--quiz);white-space:nowrap;}
  .learnmore:hover{filter:brightness(1.25);}

  /* board */
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;transition:opacity .25s,filter .25s;}
  .board.dim{opacity:.32;filter:saturate(.6);}
  /* phone two-step board: category select -> values */
  .board.mob{display:grid;grid-template-columns:1fr;gap:8px;}
  .mcat{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--rt);font-size:21px;font-weight:bold;background:#2b1240;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:15px 16px;color:var(--phos);cursor:pointer;}
  .mcat:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .mcat .mleft{font-family:var(--px);font-size:11px;color:var(--gold);white-space:nowrap;}
  .mcat.done{opacity:.4;} .mcat.done .mleft{color:var(--muted);}
  .mvtop{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .mback{font-family:var(--px);font-size:12px;background:var(--panel2);color:var(--text);border:none;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:11px 13px;cursor:pointer;}
  .mback:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .mvtitle{font-family:var(--rt);font-size:21px;font-weight:bold;color:var(--phos);}
  .mvals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .mvals .cell{font-size:18px;padding:24px 2px;}
  .cat{font-family:var(--rt);font-weight:bold;background:var(--panel);color:var(--phos);box-shadow:var(--bevel);padding:8px 4px;text-align:center;font-size:18px;line-height:1.1;min-height:48px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 2px var(--phos);}
  .cell{position:relative;font-family:var(--px);background:#2b1240;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:18px 4px;text-align:center;font-size:16px;color:var(--gold);cursor:pointer;transition:transform .1s,filter .1s;opacity:0;transform:scale(.5);text-shadow:none;}
  .cell.in{animation:cellin .4s forwards;}
  @keyframes cellin{to{opacity:1;transform:scale(1);}}
  .cell:hover{filter:brightness(1.3);}
  .cell:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .cell.bonus{background:#5a1577;color:#fff;box-shadow:var(--bevel),0 4px 0 #0a0418,0 0 16px var(--purple);}
  .cell.bonus::after{content:"⚡";position:absolute;top:2px;right:5px;font-size:12px;}
  .cell.flip{animation:flip .35s;}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.1)}100%{transform:rotateY(0)}}
  .cell.used{background:#1a0e26;color:var(--muted);cursor:default;filter:none;opacity:.35;box-shadow:var(--bevel);text-shadow:none;}
  .cell.used:hover{transform:none;filter:none;}

  .bonusbanner{font-family:var(--px);text-align:center;font-size:16px;color:var(--purple);margin-bottom:12px;animation:bonusflash .8s;text-shadow:0 0 18px var(--purple);}
  @keyframes bonusflash{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}

  /* results */
  .done-screen{text-align:center;padding:14px;}
  .rank-badge{font-family:var(--px);font-size:22px;margin:10px 0;line-height:1.5;animation:badgein .7s cubic-bezier(.2,1.3,.4,1);}
  @keyframes badgein{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .done-screen .big{font-family:var(--px);font-size:40px;color:var(--gold);text-shadow:0 0 24px var(--gold);margin:8px 0;}
  .donestats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
  .reviewlist{text-align:left;max-width:620px;margin:0 auto;display:grid;gap:10px;}
  /* splash / intro screen */
  .splash{max-width:680px;margin:0 auto;text-align:center;padding-top:6px;animation:reportin .5s cubic-bezier(.2,1.2,.4,1);}
  .splash-bots{display:flex;gap:26px;justify-content:center;margin-bottom:4px;}
  .splash-bots .repbot{display:inline-block;animation:docbob 3s ease-in-out infinite;}
  .splash-bots .repbot:last-child{animation-delay:.6s;}
  .splash-bots .repface{width:92px;}
  .splash-title{font-family:var(--px);font-size:30px;color:var(--quiz);text-shadow:0 0 12px var(--quiz);margin:8px 0;line-height:1.35;}
  .splash-sub{color:var(--muted);font-size:19px;margin:0 0 18px;line-height:1.4;}
  .splash-card{background:var(--panel2);box-shadow:var(--bevel);padding:16px 18px;text-align:left;display:grid;gap:11px;font-size:20px;line-height:1.4;max-width:580px;margin:0 auto 18px;}
  .splash-card p{margin:0;}
  .splash-card b{color:var(--gold);}
  .splash-ask{font-family:var(--px);font-size:15px;color:var(--good);margin:8px 0 16px;text-shadow:0 0 6px var(--good);}
  .splash-go{font-size:22px;padding:16px 44px;animation:gopulse 1.3s ease-in-out infinite;}
  @keyframes gopulse{0%,100%{transform:translateY(0);filter:drop-shadow(0 0 4px var(--quiz))}50%{transform:translateY(-3px);filter:drop-shadow(0 0 18px var(--quiz))}}

  .splash-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  /* leaderboard */
  .lblist{max-width:520px;margin:0 auto;display:grid;gap:6px;}
  .lbrow{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;background:var(--panel2);box-shadow:var(--bevel);padding:10px 12px;font-size:19px;}
  .lbrank{font-family:var(--px);font-size:13px;color:var(--gold);text-align:center;}
  .lbname{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lbscore{font-family:var(--px);font-size:13px;color:var(--quiz);}
  .lbcorrect{font-size:15px;color:var(--muted);}
  .lbrow.me{box-shadow:var(--bevel),0 0 14px var(--good);outline:2px solid var(--good);}
  .lbentry{background:var(--panel2);box-shadow:var(--bevel),0 0 16px rgba(255,212,94,.28);padding:14px;margin:0 auto 18px;max-width:540px;}
  .lbentry-t{font-size:18px;line-height:1.4;margin-bottom:12px;text-align:center;}
  .lbentry-t b{color:var(--gold);}
  .lbentry .lbsubmit{margin-top:0;}
  .lbdone{font-family:var(--px);font-size:13px;color:var(--good);text-align:center;margin:0 auto 14px;}
  .lbdone b{color:var(--gold);}
  .lbsubmit{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:20px;}
  input,textarea{-webkit-user-select:text;user-select:text;}
  #lbName{font-family:var(--rt);font-size:20px;padding:12px 14px;background:#0c0518;color:var(--text);border:none;box-shadow:var(--bevel);width:190px;text-transform:uppercase;letter-spacing:1px;-webkit-user-select:text;user-select:text;pointer-events:auto;touch-action:manipulation;}
  #lbName::placeholder{color:var(--muted);}

  .rounds{margin-top:22px;}
  .rounds-head{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .rounds-cap{font-family:var(--px);font-size:12px;color:var(--muted);text-align:left;line-height:1.6;max-width:380px;}
  .rounds-cap span{font-family:var(--rt);font-size:18px;color:var(--text);}
  .review{background:var(--panel2);box-shadow:var(--bevel);padding:12px 14px;margin-bottom:10px;text-align:left;}
  .rev-term{font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:0 0 4px var(--gold);}
  .rev-def{font-size:20px;color:var(--text);margin:8px 0 7px;line-height:1.4;}
  .rev-why{font-size:19px;color:var(--good);line-height:1.5;}
  .rev-why b{font-family:var(--px);font-size:9px;color:var(--quiz);margin-right:8px;letter-spacing:.5px;}
  .report{background:var(--panel2);box-shadow:var(--bevel),0 0 24px rgba(255,212,94,.22);padding:18px;margin:0 auto 22px;max-width:680px;text-align:left;animation:reportin .55s cubic-bezier(.2,1.2,.4,1);}
  @keyframes reportin{0%{opacity:0;transform:scale(.85) translateY(24px)}100%{opacity:1;transform:none}}
  .rep-title{font-family:var(--px);font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:2px;text-align:center;}
  .verdict{font-family:var(--px);font-size:24px;line-height:1.4;text-align:center;padding:16px;margin-bottom:12px;box-shadow:var(--bevel);animation:verdpulse 1.5s ease-in-out infinite;}
  @keyframes verdpulse{0%,100%{filter:drop-shadow(0 0 3px currentColor)}50%{filter:drop-shadow(0 0 18px currentColor)}}
  .verdict.perfect,.verdict.saved{color:var(--good);}
  .verdict.stable{color:var(--gold);}
  .verdict.critical{color:var(--bad);}
  .diagnosis{font-family:var(--rt);font-size:22px;text-align:center;background:#0c0518;box-shadow:var(--bevel);padding:13px 14px;margin-bottom:16px;line-height:1.4;color:var(--muted);}
  .diagnosis b{display:inline-block;margin-top:6px;font-family:var(--px);font-size:15px;line-height:1.7;color:var(--gold);text-shadow:0 0 8px var(--gold);}
  .rep-line{display:flex;gap:12px;align-items:center;margin-bottom:12px;opacity:0;animation:repline .5s ease forwards;}
  @keyframes repline{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
  .repbot{flex:0 0 auto;}
  .repface{width:58px;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 0 3px var(--neon));}
  .rep-bubble{background:var(--panel);box-shadow:var(--bevel);padding:11px 13px;font-size:20px;line-height:1.35;flex:1;}
  .rep-bubble b{font-family:var(--px);font-size:11px;}
  .rep-bubble.m b{color:#ff3ca6;} .rep-bubble.c b{color:#2ad4ff;}

  .floatpop{position:fixed;pointer-events:none;font-family:var(--px);font-size:18px;z-index:50;text-shadow:0 0 10px currentColor;animation:floatup 1s forwards;}
  .wordzoom{position:fixed;left:50%;top:42%;z-index:52;pointer-events:none;font-family:var(--rt);font-weight:bold;font-size:46px;line-height:1.1;text-align:center;max-width:92vw;color:var(--good);text-shadow:0 0 22px var(--good);opacity:0;}
  .wordzoom.go{animation:wordzoomk 1.05s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes wordzoomk{0%{opacity:0;transform:translate(-50%,-50%) scale(.45);}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.7);}}
  @keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-8px) scale(1.1);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}

  /* ===== cyberpunk medics ===== */
  .doc{position:fixed;bottom:30px;width:150px;z-index:3;pointer-events:none;--neon:#ff3ca6;transform-origin:bottom center;animation:docbob 3.4s ease-in-out infinite;transition:left .35s ease,right .35s ease;}
  .doc.left{left:40px;}
  .doc.right{right:40px;--neon:#2ad4ff;animation-delay:.7s;}
  .doc.tuck.left{left:-52px;}    /* slide out of the way while a question is open */
  .doc.tuck.right{right:-52px;}
  .doc.right .docsvg{transform:scaleX(-1);}
  .docsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 3px var(--neon));}
  .emo{position:absolute;top:-12px;left:50%;font-size:32px;opacity:0;pointer-events:none;line-height:1;filter:drop-shadow(0 0 4px rgba(0,0,0,.5));}
  .emo.show{animation:emopop 1.2s ease;}
  @keyframes emopop{0%{opacity:0;transform:translate(-50%,8px) scale(.3)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.3)}70%{opacity:1;transform:translate(-50%,-16px) scale(1)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
  .coat{fill:#eaf0ff;} .metal{fill:#241d38;} .mask{fill:#3a2f57;} .glove{fill:#2a2440;}
  .ol{stroke:var(--neon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .nofill{fill:none;}
  .neonfill,.visor,.emblem{fill:var(--neon);}
  .led{fill:var(--gold);animation:vled 1.2s infinite;}
  .seam,.vent,.steth{opacity:.7;}
  .joint{fill:#e4e8f2;stroke:#aeb6c8;stroke-width:1.5;}
  .arm{fill:none;stroke:#cfd5e2;stroke-width:5;stroke-linecap:round;}
  .spring{fill:none;stroke:#aeb6c8;stroke-width:2.5;}
  .gloss{fill:rgba(255,255,255,.4);}
  .cross{fill:#ff3b3b;}
  .pixg{fill:#cfd5e2;}
  .mp{fill:#20142e;}
  .scr{fill:#141021;}
  .clip{fill:#caa24a;}
  .eyeshine{fill:#ffffff;}
  .blush{fill:#ff8fb0;opacity:.9;}
  .mo{display:none;}
  .sweat{fill:#7fd4ff;display:none;transform-box:fill-box;transform-origin:center;}
  .armR{transform-box:fill-box;transform-origin:80% 0;transition:transform .25s ease;}

/* anatomically-shaped ECG trace: P wave, QRS complex (Q dip, tall R, S dip), T wave, on a baseline */
function ecgPath(mx,my,mw,mh){
  const base=my+mh*0.60, h=mh*0.42;   // isoelectric baseline + R-wave amplitude
  // [x-fraction of one beat, y offset * h]  (negative = upward)
  const pat=[[0,0],[.10,0],[.15,-.18],[.20,-.22],[.25,0],[.40,0],[.44,.10],[.49,-1],[.55,.32],[.60,0],[.74,0],[.82,-.30],[.88,-.34],[.95,0],[1,0]];
  const beatW=34; let d="", started=false;
  for(let bx=mx+3; bx<mx+mw-4; bx+=beatW){
    for(const p of pat){ const X=bx+p[0]*beatW; if(X>mx+mw-3) break; const Y=base+p[1]*h; d+=(started?" L":"M")+X.toFixed(1)+" "+Y.toFixed(1); started=true; }
  }
  return d;
}

  for(let i=0;i<5;i++) s+=`<rect x="${18+i*96}" y="9" width="66" height="4" fill="#2ad4ff" opacity=".35"/>`;  // ceiling light strips
  s+=`<rect x="0" y="170" width="${W}" height="3" fill="#ff3ca6" opacity=".45"/>`;          // baseboard neon
  s+=`<g class="hcross"><rect x="${W/2-6}" y="38" width="12" height="44"/><rect x="${W/2-22}" y="54" width="44" height="12"/></g>`;  // cross sign
  for(let i=0;i<4;i++){ const mw=70,mh=40,mx=36+i*122,my=96;                                 // wall vital monitors
    if(Math.abs(mx+mw/2 - W/2) < 46) continue;                                                // skip behind the cross
    s+=`<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="#04140d" stroke="#1f7a4d" stroke-width="1"/>`;
    const col=i%2?'#2ad4ff':'#39ff14';
    s+=`<path d="${ecgPath(mx,my,mw,mh)}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".78"/>`;
  }

    s+=`<rect x="${bx}" y="${by}" width="120" height="10" fill="#2a2440"/>`;

}

  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}

const fx=$("#fx"), fxc=fx.getContext("2d");
let parts=[], fxRAF=null;
function fxResize(){ fx.width=innerWidth; fx.height=innerHeight; }
addEventListener("resize",fxResize); fxResize();
function burst(x,y,n,colors,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(Math.random()*(power||6))+2;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:0.18,life:1,
      c:colors[i%colors.length],size:(Math.random()*4|0)*2+6,rot:0,vr:0});
  }
  if(!fxRAF) fxLoop();
}
function rain(n){
  const colors=["#ffd45e","#ff3ca6","#2ad4ff","#ff3b3b","#b388ff","#fff"];
  for(let i=0;i<n;i++){
    parts.push({x:Math.random()*fx.width,y:-20,vx:(Math.random()-.5)*2,vy:Math.random()*3+2,g:0.08,life:1.6,
      c:colors[i%colors.length],size:(Math.random()*4|0)*2+6,rot:0,vr:0});
  }
  if(!fxRAF) fxLoop();
}
function fxLoop(){
  fxc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=0.012;
    fxc.globalAlpha=Math.max(0,p.life); fxc.fillStyle=p.c;
    fxc.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size); /* square pixels */
  });
  if(parts.length) fxRAF=requestAnimationFrame(fxLoop); else {fxRAF=null; fxc.clearRect(0,0,fx.width,fx.height);}
}

function multiplierFor(s){ return s>=8?3 : s>=6?2.5 : s>=4?2 : s>=2?1.5 : 1; }

/* ===== adaptive spaced repetition: weight the board toward weak/new terms ===== */
let STATS = (function(){ try{ return JSON.parse(localStorage.getItem("mq_stats")||"{}"); }catch(e){ return {}; } })();
function saveStats(){ try{ localStorage.setItem("mq_stats",JSON.stringify(STATS)); }catch(e){} }
function termWeight(t){ const s=STATS[t]; if(!s||!s.seen) return 6; return s.streak>=3?1 : s.streak>=1?2 : 4; }  // new=6, weak=4, learning=2, mastered=1
function recordStat(t,right){
  const s=STATS[t]||(STATS[t]={seen:0,correct:0,wrong:0,streak:0,last:0});
  s.seen++; if(right){ s.correct++; s.streak++; } else { s.wrong++; s.streak=0; } s.last=Date.now();
  saveStats();
}
function weightedPick(items,n){   // pick n distinct items, biased by termWeight (no replacement)
  const pool=items.slice(), out=[];
  while(out.length<n && pool.length){
    const ws=pool.map(it=>termWeight(it.a)); let total=ws.reduce((a,b)=>a+b,0), r=Math.random()*total, i=0;
    while(i<ws.length-1 && r>ws[i]){ r-=ws[i]; i++; }
    out.push(pool[i]); pool.splice(i,1);
  }
  return out;
}

function optDefs(item){   // definitions of the OTHER options (distractors), as a secondary note

function animateNum(el,to){
  const from=parseInt(el.textContent)||0, dur=500, t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function culprit(){
  const uniq=[...new Set(missed)]; if(!uniq.length) return null;
  const tally={}; uniq.forEach(t=>{const c=CAT_OF[t]; tally[c]=(tally[c]||0)+1;});
  let topCat=null,topN=0; Object.keys(tally).forEach(c=>{if(tally[c]>topN){topN=tally[c];topCat=c;}});
  let term=null,topP=-1;
  uniq.filter(t=>CAT_OF[t]===topCat).forEach(t=>{ const p=((BOARD[topCat]||[]).find(i=>i.a===t)||{}).p||0; if(p>topP){topP=p;term=t;} });
  return {cat:topCat, domain:DOMAIN[topCat], term, danger:DANGER[term]||("complications from "+DOMAIN[topCat])};
}
function debrief(died){

function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function lbReady(){ return LB.url && LB.url.indexOf("YOUR-PROJECT")<0 && LB.anonKey && LB.anonKey.indexOf("YOUR-")<0; }
function lbBlobOn(){ return LB.blob && LB.blob.indexOf("jsonBlob/")>0; }

function lbSort(a){ return (Array.isArray(a)?a:[]).slice().sort((x,y)=>y.score-x.score); }
async function lbFetch(){
  if(lbReady()){
    try{
      const r=await fetch(`${LB.url}/rest/v1/${LB.table}?select=name,score,correct&order=score.desc&limit=20`,{headers:lbHeaders()});
      if(r.ok) return await r.json();
    }catch(e){}
  } else if(lbBlobOn()){
    try{
      const r=await fetch(LB.blob,{cache:"no-store"});
      if(r.ok) return lbSort(await r.json()).slice(0,20);
    }catch(e){}
  }
  return lbSort(lbLocal()).slice(0,20);
}
async function lbSubmit(name,score,correct){
  name=(name||"ANON").slice(0,16); const entry={name,score,correct}; let remote=false;
  if(lbReady()){
    try{
      const r=await fetch(`${LB.url}/rest/v1/${LB.table}`,{method:"POST",headers:lbHeaders({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify(entry)});
      remote=r.ok;
    }catch(e){}
  } else if(lbBlobOn()){
    try{
      const g=await fetch(LB.blob,{cache:"no-store"}); let a=[]; if(g.ok){ a=await g.json(); if(!Array.isArray(a)) a=[]; }
      a.push(entry); a=lbSort(a).slice(0,100);
      const p=await fetch(LB.blob,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(a)});
      remote=p.ok;
    }catch(e){}
  }
  try{ const la=lbLocal(); la.push(entry); localStorage.setItem("mq_scores",JSON.stringify(lbSort(la).slice(0,50))); }catch(e){}
  return remote;
}
